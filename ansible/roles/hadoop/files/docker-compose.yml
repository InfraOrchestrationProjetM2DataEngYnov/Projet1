version: "3.8"

services:
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    env_file:
      - .env
    environment:
      - CLUSTER_NAME=test
      - CORE_CONF_fs_defaultFS=hdfs://namenode:8020
      - HDFS_CONF_dfs_namenode_rpc_address_namenode=namenode:8020
      - HDFS_CONF_dfs_webhdfs_enabled=true
      - INIT_DFS_PERMISSIONS=no
    ports:
      - "9870:9870"
      - "8020:8020"
    volumes:
      - namenode:/hadoop/dfs/name
    networks:
      - infra-kafka

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    env_file:
      - .env
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://namenode:8020
      - SERVICE_PRECONDITION=namenode:8020
    volumes:
      - datanode:/hadoop/dfs/data
    depends_on:
      - namenode
    networks:
      - infra-kafka

  pull-hdfs:
    build: ./hadoop-pull
    container_name: pull-hdfs
    env_file:
      - .env
    depends_on:
      - namenode
    networks:
      - infra-kafka

  spark-master:
    image: bde2020/spark-master:3.1.1-hadoop3.2
    container_name: spark-master
    env_file:
      - .env
    environment:
      - ENABLE_INIT_DAEMON=false
      - SPARK_MODE=master
      - SPARK_MASTER_HOST=spark-master
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8080
      - CORE_CONF_fs_defaultFS=hdfs://namenode:8020
    ports:
      - "18080:8080"
      - "7077:7077"
    depends_on:
      - namenode
    networks:
      - infra-kafka

  spark-worker:
    image: bde2020/spark-worker:3.1.1-hadoop3.2
    container_name: spark-worker
    env_file:
      - .env
    environment:
      - ENABLE_INIT_DAEMON=false
      - SPARK_MODE=worker
      - SPARK_MASTER=spark://spark-master:7077
      - CORE_CONF_fs_defaultFS=hdfs://namenode:8020
      - SPARK_WORKER_CORES=4        # Augmenter à 4
      - SPARK_WORKER_MEMORY=4g      # Augmenter à 4g
    depends_on:
      - spark-master
      - namenode
    networks:
      - infra-kafka
    ports:
      - "8081:8081"

  hive-metastore-postgresql:
    image: postgres:13
    container_name: hive-metastore-postgresql
    environment:
      - POSTGRES_USER=hive
      - POSTGRES_PASSWORD=hive
      - POSTGRES_DB=metastore
    volumes:
      - hive-metastore-db:/var/lib/postgresql/data
    networks:
      - infra-kafka
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  hive-schematool:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: hive-schematool
    env_file:
      - .env
    environment:
      - HIVE_METASTORE_DB_HOST=hive-metastore-postgresql
      - HIVE_METASTORE_DB_NAME=metastore
      - HIVE_METASTORE_DB_USER=hive
      - HIVE_METASTORE_DB_PASS=hive
      - CORE_CONF_fs_defaultFS=hdfs://namenode:8020
    depends_on:
      hive-metastore-postgresql:
        condition: service_healthy
    networks:
      - infra-kafka
    command: >
      bash -c "
      echo 'Waiting for PostgreSQL to be fully ready...' &&
      sleep 15 &&
      echo 'Attempting to initialize Hive schema...' &&
      /opt/hive/bin/schematool -dbType postgres -initSchema 2>&1 || 
      (echo 'Init failed or schema exists, checking info...' && /opt/hive/bin/schematool -dbType postgres -info)
      "
    restart: "no"

  hive-metastore:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: hive-metastore
    env_file:
      - .env
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://namenode:8020
      - SERVICE_PRECONDITION=namenode:8020 hive-metastore-postgresql:5432
      # Configuration PostgreSQL via HIVE_SITE_CONF
      - HIVE_SITE_CONF_javax_jdo_option_ConnectionURL=jdbc:postgresql://hive-metastore-postgresql:5432/metastore
      - HIVE_SITE_CONF_javax_jdo_option_ConnectionDriverName=org.postgresql.Driver
      - HIVE_SITE_CONF_javax_jdo_option_ConnectionUserName=hive
      - HIVE_SITE_CONF_javax_jdo_option_ConnectionPassword=hive
      - HIVE_SITE_CONF_hive_metastore_warehouse_dir=/user/hive/warehouse
    depends_on:
      hive-metastore-postgresql:
        condition: service_healthy
      namenode:
        condition: service_started
    ports:
      - "9083:9083"
    networks:
      - infra-kafka
    command: /opt/hive/bin/hive --service metastore
    restart: unless-stopped

  hive-server:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: hive-server
    env_file:
      - .env
    environment:
      - HIVE_METASTORE_URI=thrift://hive-metastore:9083
      - CORE_CONF_fs_defaultFS=hdfs://namenode:8020
      - SERVICE_PRECONDITION=hive-metastore:9083
    depends_on:
      - hive-metastore
    ports:
      - "10000:10000"
      - "10002:10002"
    networks:
      - infra-kafka

  spark-job:
    build: ./jobs
    container_name: spark-job
    env_file:
      - .env
    depends_on:
      - spark-master
      - hive-metastore
      - hive-server
    networks:
      - infra-kafka
    volumes:
      - ./jobs:/opt/hadoop/jobs
    command: >
      bash -c "
      echo 'Waiting 90 seconds for services...' &&
      sleep 90 &&
      exec /spark/bin/spark-submit
      --master spark://spark-master:7077
      --deploy-mode client
      --conf spark.sql.warehouse.dir=hdfs://namenode:8020/user/hive/warehouse
      --conf spark.hadoop.hive.metastore.uris=thrift://hive-metastore:9083
      /opt/hadoop/jobs/json_to_hive_daemon.py
      "
    restart: unless-stopped

networks:
  infra-kafka:
    external: true

volumes:
  namenode:
  datanode:
  hive-metastore-db:
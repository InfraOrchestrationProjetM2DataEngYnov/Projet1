  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose
    state: present
    update_cache: true

# -------------------- Préparation des dossiers --------------------
- name: Create project directory
  file:
    path: /opt/hadoop
    state: directory

- name: Copy docker-compose file
  copy:
    src: files/docker-compose.yml
    dest: /opt/hadoop/docker-compose.yml

- name: Generate .env from template
  template:
    src: templates/.env.j2
    dest: /opt/hadoop/.env

# -------------------- Copie jobs / scripts --------------------
- name: Copy pull_Hdfs folder
  copy:
    src: "{{ playbook_dir }}/roles/hadoop/files/pull_hdfs/"
    dest: /opt/hadoop/hadoop-pull
    mode: '0755'

- name: Copy spark_transform folder
  copy:
    src: "{{ playbook_dir }}/roles/hadoop/files/spark_transform/"
    dest: /opt/hadoop/jobs
    mode: '0755'

# -------------------- Docker network --------------------
- name: Ensure external Docker network infra-kafka exists
  community.docker.docker_network:
    name: infra-kafka
    state: present

# -------------------- Déploiement stack Docker --------------------
- name: Run stack with environment file
  community.docker.docker_compose:
    project_src: /opt/hadoop
    files:
      - docker-compose.yml
    build: true
    restarted: true
    state: present
    env_file: /opt/hadoop/.env
  environment:
    DOCKER_API_VERSION: "1.48"

# ========================
# POSTGRESQL & HIVE METASTORE INITIALIZATION
# ========================

- name: Wait for PostgreSQL to be ready
  community.docker.docker_container_exec:
    container: hive-metastore-postgresql
    command: pg_isready -U hive -d metastore
  register: pg_ready
  retries: 15
  delay: 5
  until: pg_ready.rc == 0

- name: Check if Hive schema already exists
  shell: |
    docker exec hive-metastore-postgresql psql -U hive -d metastore -t -c \
    "SELECT COUNT(*) FROM information_schema.tables WHERE table_name='VERSION'" 2>/dev/null || echo "0"
  register: schema_check
  changed_when: false

- name: Stop Hive Metastore before schema init
  community.docker.docker_container:
    name: hive-metastore
    state: stopped
  ignore_errors: yes

- name: Initialize Hive Metastore schema
  shell: |
    docker run --rm \
      --network infra-kafka \
      -e HIVE_SITE_CONF_javax_jdo_option_ConnectionURL=jdbc:postgresql://hive-metastore-postgresql:5432/metastore \
      -e HIVE_SITE_CONF_javax_jdo_option_ConnectionDriverName=org.postgresql.Driver \
      -e HIVE_SITE_CONF_javax_jdo_option_ConnectionUserName=hive \
      -e HIVE_SITE_CONF_javax_jdo_option_ConnectionPassword=hive \
      bde2020/hive:2.3.2-postgresql-metastore \
      /opt/hive/bin/schematool -dbType postgres -initSchema -verbose
  when: (schema_check.stdout | trim) == '0'
  register: schema_init_verbose

- name: Ensure Hive Metastore is started
  community.docker.docker_container:
    name: hive-metastore
    state: started

- name: Wait for Metastore initialization
  pause:
    seconds: 30

# ========================
# HDFS SETUP & PERMISSIONS
# ========================

- name: Wait for Namenode to be ready
  community.docker.docker_container_exec:
    container: namenode
    command: bash -c "hdfs dfsadmin -report"
  register: namenode_status
  retries: 15
  delay: 10
  until: namenode_status.rc == 0

- name: Ensure HDFS safe mode is OFF
  community.docker.docker_container_exec:
    container: namenode
    command: hdfs dfsadmin -safemode leave
  retries: 5
  delay: 10
  register: safemode_leave
  until: safemode_leave.rc == 0 or 'Safe mode is already OFF' in safemode_leave.stdout

# --- Hive directories ---
- name: Create and configure Hive directories in HDFS
  community.docker.docker_container_exec:
    container: namenode
    command: |
      bash -c "
      hdfs dfs -mkdir -p /user/hive/warehouse &&
      hdfs dfs -mkdir -p /tmp/hive &&
      hdfs dfs -mkdir -p /tmp &&
      hdfs dfs -chmod 1777 /user/hive/warehouse &&
      hdfs dfs -chmod 1777 /tmp &&
      hdfs dfs -chmod 1777 /tmp/hive &&
      hdfs dfs -chown -R hive:supergroup /user/hive &&
      hdfs dfs -chown -R hive:supergroup /tmp/hive
      "

# --- Directories pour pull_HDFS / météo ---
- name: Create /user/hdfs/weather in HDFS
  community.docker.docker_container_exec:
    container: namenode
    command: hdfs dfs -mkdir -p /user/hdfs/weather

- name: Fix ownership and permissions for /user/hdfs recursively
  community.docker.docker_container_exec:
    container: namenode
    command: |
      bash -c "
      hdfs dfs -chown -R hdfs:supergroup /user/hdfs &&
      hdfs dfs -chmod -R 755 /user/hdfs &&
      echo 'Permissions fixed for /user/hdfs'
      "

# --- Vérification ---
- name: List HDFS structure
  community.docker.docker_container_exec:
    container: namenode
    command: hdfs dfs -ls -R /user
  register: hdfs_list

- name: Display HDFS directory structure
  debug:
    var: hdfs_list.stdout_lines

# ========================
# REDÉMARRAGE SERVICES
# ========================
- name: Restart Hive Metastore after HDFS setup
  community.docker.docker_container:
    name: hive-metastore
    state: started
    restart: yes

- name: Restart Hive Server after Metastore is ready
  community.docker.docker_container:
    name: hive-server
    state: started
    restart: yes

# ========================
# BUILD & START PULL_HDFS CONTAINER
# ========================

- name: Build pull_HDFS Docker image locally
  community.docker.docker_image:
    name: pull_hdfs_local
    tag: latest
    source: build
    build:
      path: /opt/hadoop/hadoop-pull
      dockerfile: Dockerfile
    force_source: true
    
- name: Start pull_HDFS container
  community.docker.docker_container:
    name: pull-hdfs
    image: pull_hdfs_local:latest
    state: started
    restart_policy: always
    networks:
      - name: infra-kafka
    volumes:
      - /opt/hadoop/hadoop-pull:/app
    env_file: /opt/hadoop/.env




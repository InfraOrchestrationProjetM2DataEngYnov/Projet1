version: "3.8"

networks:
  infra-kafka:
    external: true

volumes:
  grafana_data:

services:
  # -------------------- MONITORING --------------------
  prometheus:
    build:
      context: ./prometheus
      dockerfile: Dockerfile
    container_name: prometheus
    ports:
      - "45090:9090"        # Prometheus UI (9090 → 45090)
    networks:
      - infra-kafka

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "43000:3000"        # Grafana UI (3000 → 43000)
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - infra-kafka
  
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
    ports:
      - "45187:9187"        # Postgres exporter (9187 → 45187)
    depends_on:
      - grafana
      - prometheus
    networks:
      - infra-kafka

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - "45100:9100"        # Node exporter (9100 → 45100)
    networks:
      - infra-kafka
    depends_on:
      - grafana
      - prometheus
    command:
      - '--path.rootfs=/host'
    volumes:
      - '/:/host:ro'

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: kafka-exporter
    command:
      - '--kafka.server=kafka:9092'
    ports:
      - "45308:9308"        # Kafka exporter (9308 → 45308)
    depends_on:
      - grafana
      - prometheus
    restart: unless-stopped
    networks:
      - infra-kafka
